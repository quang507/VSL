# Build file APK (bản debug) để cài thử lên điện thoại Android hoặc giả lập như LDPlayer.
# Tải về ở trang Actions → lần chạy mới nhất → mục Artifacts → "vslv-apk".
# Bản debug ký bằng khoá thử, KHÔNG dùng để nộp Google Play (bản nộp cần khoá riêng + định dạng .aab).
name: Build Android APK

on:
  push:
    branches: [main, redesign-vslv]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # Capacitor 8 + Android Gradle Plugin 8.13 cần JDK 21
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Build web (không có tiền tố đường dẫn, như bản đóng gói)
        run: npm run build
      - name: Chép web vào project Android
        run: npx cap sync android
      - name: Đóng gói APK debug
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Đặt tên file
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/vslv-debug-${GITHUB_SHA::7}.apk"
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: vslv-apk
          path: dist/*.apk
          retention-days: 30
